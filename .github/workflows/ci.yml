name: Rust CI & Linux Release Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-and-test:
    name: Format, Clippy & Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit and integration tests (debug)
        run: cargo test --all-targets

      - name: Run unit and integration tests (release)
        run: cargo test --release --all-targets

  build-linux-release:
    name: Build Linux Release Binary
    needs: check-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build optimized release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: kronoprime-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/kronoprime
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release (on v* tags)
    needs: build-linux-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux binary artifact
        uses: actions/download-artifact@v4
        with:
          name: kronoprime-linux-x86_64
          path: artifact

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/kronoprime
